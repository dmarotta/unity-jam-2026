<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
    <title>Lucky Number</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #070308; }
      #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
      #unity-canvas { display: block; background: #070308; outline: none; }
      #loader {
        position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: radial-gradient(ellipse at center, #2a1410 0%, #070308 70%);
        font-family: Georgia, "Times New Roman", serif; color: #ffd27a; transition: opacity 0.6s ease;
      }
      #loader h1 {
        margin: 0 0 6px; font-size: clamp(36px, 7vw, 84px); letter-spacing: 0.06em;
        text-shadow: 0 4px 0 #6a1010, 0 0 30px rgba(255, 190, 80, 0.45);
      }
      #loader p { margin: 0 0 28px; color: #e8d6b0; font-size: clamp(14px, 1.8vw, 20px); letter-spacing: 0.08em; }
      #bar { width: min(420px, 70vw); height: 14px; border: 2px solid #c99a45; border-radius: 9px; padding: 2px; background: #1a0d10; }
      #fill { height: 100%; width: 0; border-radius: 6px; background: linear-gradient(90deg, #b8862b, #ffe08a); box-shadow: 0 0 12px #ffcf6a; transition: width 0.2s; }
      #warning { position: fixed; left: 50%; top: 12px; transform: translateX(-50%); font: 14px sans-serif; display: none; }
    </style>
  </head>
  <body>
    <div id="stage"><canvas id="unity-canvas" tabindex="-1"></canvas></div>
    <div id="loader">
      <h1>LUCKY NUMBER</h1>
      <p>Descending into the depths of fortune...</p>
      <div id="bar"><div id="fill"></div></div>
    </div>
    <div id="warning"></div>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      // Letterbox a 16:9 canvas inside the window.
      function fit() {
        var w = window.innerWidth, h = window.innerHeight;
        var cw = Math.min(w, h * 16 / 9), ch = cw * 9 / 16;
        canvas.style.width = Math.floor(cw) + "px";
        canvas.style.height = Math.floor(ch) + "px";
      }
      window.addEventListener("resize", fit);
      fit();

      function showBanner(msg, type) {
        var banner = document.querySelector("#warning");
        var div = document.createElement("div");
        div.textContent = msg;
        div.style.cssText = "padding:8px 12px;border-radius:6px;margin-top:6px;" + (type == "error" ? "background:#b3202c;color:#fff" : "background:#ffd27a;color:#200");
        banner.appendChild(div);
        banner.style.display = "block";
        if (type != "error") setTimeout(function () { banner.removeChild(div); if (!banner.children.length) banner.style.display = "none"; }, 5000);
      }

      var config = {
        arguments: [],
        dataUrl: "Build/export.data.unityweb",
        frameworkUrl: "Build/export.framework.js.unityweb",
        codeUrl: "Build/export.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Team Lucky Number",
        productName: "Lucky Number",
        productVersion: "1.0",
        showBanner: showBanner,
        autoSyncPersistentDataPath: true,
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 1.5),
      };

      var script = document.createElement("script");
      script.src = "Build/export.loader.js";
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          document.querySelector("#fill").style.width = (100 * progress) + "%";
        }).then(function () {
          var loader = document.querySelector("#loader");
          loader.style.opacity = "0";
          setTimeout(function () { loader.style.display = "none"; }, 650);
          canvas.focus();
        }).catch(function (message) { showBanner(message, "error"); });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
